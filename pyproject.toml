[project]
name = "mas-finance"
version = "2.2.0"
description = "Evidence-first iterative financial research agent and service."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "opentelemetry-api>=1.28,<2",
  "tokenizers>=0.21,<1",
  "typing-extensions>=4.12,<5",
]

[project.scripts]
mas-finance = "mas_finance.cli:main"

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0,<3",
  "starlette>=1.3,<2",
  "uvicorn>=0.30,<1",
]
infra = [
  "psycopg[binary]>=3.2,<4",
]
all = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0,<3",
  "starlette>=1.3,<2",
  "uvicorn>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mas_finance = ["web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["mas_finance"]

[tool.coverage.report]
fail_under = 80
show_missing = true
